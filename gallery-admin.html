<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery Curation — Bello Automotive (internal tool)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; }
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    /* ---------- Sidebar: category tree ---------- */
    .admin-side {
      border-right: 1px solid var(--border); background: var(--surface);
      padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .admin-side h1 { font-size: 1.05rem; margin: 0 0 4px; }
    .admin-side .sub { color: var(--muted); font-size: 0.72rem; margin-bottom: 14px; line-height: 1.4; }
    .tree-cat {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px; margin-bottom: 4px; border-radius: 8px; cursor: pointer;
      border: 1px dashed transparent; font-size: 0.88rem; font-weight: 600;
      color: var(--ink); background: transparent; width: 100%; text-align: left;
    }
    .tree-cat:hover { background: var(--surface-2); }
    .tree-cat.active { background: var(--surface-2); border-color: var(--border); }
    .tree-cat .n { color: var(--muted); font-size: 0.75rem; font-weight: 400; }
    .tree-cat.drop-ok { border-color: var(--accent); background: rgba(255,185,46,.12); }
    .tree-sep { border-top: 1px solid var(--border); margin: 12px 0; }
    .tree-cat.danger { color: #e07a6a; }

    /* ---------- Main: toolbar + grid ---------- */
    .admin-main { padding: 18px 22px 60px; }
    .admin-bar {
      position: sticky; top: 0; z-index: 20; background: var(--bg);
      padding: 10px 0 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .admin-bar input[type="search"], .admin-bar select {
      background: var(--surface); color: var(--ink); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; font-size: .88rem;
    }
    .status-line { font-size: .82rem; color: var(--muted); }
    .status-line.ok { color: #7ec97e; }
    .status-line.err { color: #e07a6a; }

    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .admin-item {
      position: relative; border: 2px solid var(--border); border-radius: 8px;
      overflow: hidden; cursor: grab; background: var(--surface);
      padding: 0; text-align: left; color: var(--ink); font: inherit; user-select: none;
    }
    .admin-item:active { cursor: grabbing; }
    .admin-item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; pointer-events: none; }
    .admin-item .meta {
      padding: 5px 7px; font-size: 0.64rem; line-height: 1.3; color: var(--muted); word-break: break-word;
    }
    .admin-item .meta strong { display: block; color: var(--accent); font-size: 0.62rem; letter-spacing: .04em; }
    .admin-item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,185,46,.35); }
    .admin-item.staged { opacity: .62; }
    .admin-item.modified::after {
      content: "edited"; position: absolute; top: 5px; left: 5px;
      background: var(--accent); color: #1a1510; font-size: .58rem; font-weight: 800;
      padding: 2px 6px; border-radius: 4px; letter-spacing: .06em; text-transform: uppercase;
    }
    .admin-item.removed { opacity: .25; }
    .admin-item.removed::after { content: "removed"; background: #c0392b; color: #fff; }
    .drop-hint { color: var(--muted); font-size: .8rem; margin: 0 0 10px; }
    .drop-hint b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <h1>Gallery Curation</h1>
      <p class="sub">Click photos to select (multi), then drag them onto a category. Dropping assigns that category and unhides the photo.</p>
      <div id="tree"></div>
      <div class="tree-sep"></div>
      <div id="treeExtra"></div>
      <div class="tree-sep"></div>
      <button type="button" class="btn btn-primary btn-sm" id="downloadBtn" disabled style="width:100%;">Download gallery.html</button>
      <button type="button" class="btn btn-ghost btn-sm" id="resetBtn" style="width:100%;margin-top:8px;">Reload &amp; discard edits</button>
    </aside>

    <main class="admin-main">
      <div class="admin-bar">
        <input type="search" id="fSearch" placeholder="Search filename or caption…">
        <select id="fStaged">
          <option value="all">All photos</option>
          <option value="staged">Staged / uncategorized only</option>
          <option value="live">Live photos only</option>
        </select>
        <span style="flex:1"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="selectAll">Select shown</button>
        <button type="button" class="btn btn-ghost btn-sm" id="selectNone">Clear selection</button>
      </div>
      <p class="drop-hint" id="dropHint"></p>
      <div class="admin-grid" id="grid"></div>
      <p class="status-line" id="status"></p>
    </main>
  </div>

  <script>
  (function () {
    "use strict";

    var CATS = [
      ["fabrication", "Welding & Fabrication"],
      ["collision",   "Collision & Repair"],
      ["colorshift",  "Color-Shift"],
      ["candy",       "Candy & Flake"],
      ["graphics",    "Graphics"],
      ["signs",       "Signs & Pinstripe"],
      ["wild",        "Wild Surfaces"],
      ["restoration", "Restoration"]
    ];
    var CAT_NAME = {};
    CATS.forEach(function (c) { CAT_NAME[c[0]] = c[1]; });

    function autoLabel(cats) {
      return cats.map(function (s) { return CAT_NAME[s] || s; }).join(" · ");
    }

    var state = [];        // one record per figure
    var selected = {};     // src -> true
    var activeCat = null;  // sidebar filter
    var dragPayload = [];  // records being dragged

    var tree = document.getElementById("tree");
    var treeExtra = document.getElementById("treeExtra");
    var grid = document.getElementById("grid");
    var status = document.getElementById("status");
    var dropHint = document.getElementById("dropHint");
    var fSearch = document.getElementById("fSearch");
    var fStaged = document.getElementById("fStaged");
    var downloadBtn = document.getElementById("downloadBtn");

    function say(msg, cls) {
      status.textContent = msg || "";
      status.className = "status-line" + (cls ? " " + cls : "");
    }

    /* ---------- Load ---------- */
    fetch("gallery.html").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll(".gallery-item").forEach(function (fig) {
        var img = fig.querySelector("img");
        var small = fig.querySelector("figcaption small");
        var cap = fig.querySelector(".gallery-trigger");
        var dataCap = cap ? cap.getAttribute("data-caption") : "";
        var m = dataCap.match(/^([^—]*)—\s*(.*)$/);
        state.push({
          fig: fig,
          src: img.getAttribute("src"),
          alt: img.getAttribute("alt") || "",
          cats: (fig.getAttribute("data-cat") || "").split(/\s+/).filter(Boolean),
          hidden: fig.hasAttribute("hidden"),
          heading: small ? small.textContent : "",
          desc: m ? m[2] : "",
          removed: false,
          dirty: false
        });
      });
      render();
      say(state.length + " photos loaded.");
    }).catch(function (e) {
      say("Couldn't load gallery.html (" + e.message + "). Run from a local web server, " +
          "e.g.  npx http-server  — opening the file directly blocks fetch().", "err");
    });

    /* ---------- Sidebar tree ---------- */
    function catCount(slug) {
      return state.filter(function (s) { return s.cats.indexOf(slug) !== -1; }).length;
    }

    function makeCatBtn(label, opts) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tree-cat" + (opts.danger ? " danger" : "");
      var name = document.createElement("span");
      name.textContent = label;
      var n = document.createElement("span");
      n.className = "n";
      b.appendChild(name); b.appendChild(n);
      if (opts.countFn) b._countFn = opts.countFn;
      if (opts.click) b.addEventListener("click", function () { opts.click(b); });
      if (opts.drop) {
        b.addEventListener("dragover", function (e) { e.preventDefault(); b.classList.add("drop-ok"); });
        b.addEventListener("dragleave", function () { b.classList.remove("drop-ok"); });
        b.addEventListener("drop", function (e) {
          e.preventDefault(); b.classList.remove("drop-ok");
          opts.drop(dragPayload.slice());
        });
      }
      return b;
    }

    function buildTree() {
      tree.innerHTML = ""; treeExtra.innerHTML = "";

      var all = makeCatBtn("All photos", {
        countFn: function () { return state.length; },
        click: function () { activeCat = null; render(); }
      });
      if (!activeCat) all.classList.add("active");
      tree.appendChild(all);

      CATS.forEach(function (c) {
        var b = makeCatBtn(c[1], {
          countFn: function () { return catCount(c[0]); },
          click: function () { activeCat = c[0]; render(); },
          drop: function (recs) { assign(recs, c[0], true); }
        });
        b.title = "Drop photos here to add “" + c[1] + "”";
        if (activeCat === c[0]) b.classList.add("active");
        tree.appendChild(b);
      });

      var unc = makeCatBtn("Uncategorized", {
        countFn: function () { return state.filter(function (s) { return !s.cats.length; }).length; },
        click: function () { activeCat = "__none"; render(); },
        drop: function (recs) {
          recs.forEach(function (s) {
            s.cats = []; s.dirty = true;
          });
          render();
          say("Cleared all categories for " + recs.length + " photo(s).", "ok");
        }
      });
      unc.title = "Drop photos here to strip all categories (keeps them staged/hidden)";
      treeExtra.appendChild(unc);

      var trash = makeCatBtn("Remove from gallery", {
        danger: true,
        countFn: function () { return state.filter(function (s) { return s.removed; }).length; },
        drop: function (recs) {
          recs.forEach(function (s) { s.removed = true; s.dirty = true; });
          render();
          say(recs.length + " photo(s) marked removed (applied on download).", "ok");
        }
      });
      trash.title = "Drop photos here to remove them from the page";
      treeExtra.appendChild(trash);

      var restore = document.createElement("button");
      restore.type = "button";
      restore.className = "tree-cat";
      restore.innerHTML = "<span>Undo removals</span>";
      restore.addEventListener("click", function () {
        var n = 0;
        state.forEach(function (s) { if (s.removed) { s.removed = false; n++; } });
        render();
        say(n ? n + " photo(s) restored." : "Nothing to restore.", "ok");
      });
      treeExtra.appendChild(restore);

      // counts
      document.querySelectorAll(".tree-cat").forEach(function (b) {
        if (b._countFn) b.querySelector(".n").textContent = b._countFn();
      });
    }

    /* ---------- Assignment ---------- */
    function assign(recs, slug, on) {
      var n = 0;
      recs.forEach(function (s) {
        var i = s.cats.indexOf(slug);
        if (on && i === -1) { s.cats.push(slug); n++; }
        else if (!on && i !== -1) { s.cats.splice(i, 1); n++; }
        if (n) {
          s.dirty = true;
          if (s.cats.length) s.heading = autoLabel(s.cats); // auto-label on drop
        }
      });
      render();
      say(n ? "Added “" + CAT_NAME[slug] + "” to " + n + " photo(s); headings auto-labeled." : "No change.", "ok");
    }

    /* ---------- Grid ---------- */
    function visible(s) {
      if (activeCat === "__none" && s.cats.length) return false;
      if (activeCat && activeCat !== "__none" && s.cats.indexOf(activeCat) === -1) return false;
      var mode = fStaged.value;
      if (mode === "staged" && s.cats.length) return false;
      if (mode === "live" && (s.hidden || !s.cats.length)) return false;
      var q = fSearch.value.trim().toLowerCase();
      if (!q) return true;
      return (s.src + " " + s.alt + " " + s.heading + " " + s.desc).toLowerCase().indexOf(q) !== -1;
    }

    function render() {
      buildTree();
      grid.innerHTML = "";
      var shown = 0;
      state.forEach(function (s) {
        if (!visible(s)) return;
        shown++;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "admin-item" +
          (selected[s.src] ? " selected" : "") +
          (s.dirty ? " modified" : "") +
          (s.removed ? " removed" : "") +
          (!s.cats.length || s.hidden ? " staged" : "");
        b.draggable = true;

        var img = document.createElement("img");
        img.src = s.src; img.alt = s.alt; img.loading = "lazy";
        var meta = document.createElement("div");
        meta.className = "meta";
        var st = document.createElement("strong");
        st.textContent = s.heading || "(no heading)";
        var fn = document.createElement("span");
        fn.textContent = s.src.replace("images/", "");
        meta.appendChild(st); meta.appendChild(fn);
        b.appendChild(img); b.appendChild(meta);

        b.addEventListener("click", function () {
          selected[s.src] = !selected[s.src];
          if (!selected[s.src]) delete selected[s.src];
          render();
        });
        b.addEventListener("dragstart", function (e) {
          // dragging a selected photo drags the whole selection
          dragPayload = selected[s.src]
            ? state.filter(function (x) { return selected[x.src]; })
            : [s];
          e.dataTransfer.setData("text/plain", dragPayload.length + " photo(s)");
          e.dataTransfer.effectAllowed = "copy";
        });
        b.addEventListener("dragend", function () { dragPayload = []; });
        grid.appendChild(b);
      });

      var sel = Object.keys(selected).length;
      var mod = state.filter(function (s) { return s.dirty; }).length;
      var staged = state.filter(function (s) { return !s.cats.length && !s.removed; }).length;
      dropHint.innerHTML = sel
        ? "Drag the " + (sel === 1 ? "selected photo" : "<b>" + sel + " selected photos</b>") + " onto a category on the left."
        : staged + " photo(s) still uncategorized. Click photos to select them.";
      say(shown + " shown · " + sel + " selected · " + mod + " edited", "");
      downloadBtn.disabled = mod === 0;
    }

    /* ---------- Toolbar ---------- */
    document.getElementById("selectAll").addEventListener("click", function () {
      state.forEach(function (s) { if (visible(s)) selected[s.src] = true; });
      render();
    });
    document.getElementById("selectNone").addEventListener("click", function () {
      selected = {}; render();
    });
    fSearch.addEventListener("input", render);
    fStaged.addEventListener("change", render);
    document.getElementById("resetBtn").addEventListener("click", function () { location.reload(); });

    /* ---------- Export ---------- */
    downloadBtn.addEventListener("click", function () {
      state.forEach(function (s) {
        if (!s.dirty && !s.removed) return;
        if (s.removed) { s.fig.remove(); return; }
        if (s.cats.length) s.fig.removeAttribute("hidden");
        s.fig.setAttribute("data-cat", s.cats.join(" "));
        var small = s.fig.querySelector("figcaption small");
        if (small) small.textContent = s.heading;
        var cap = s.fig.querySelector(".gallery-trigger");
        if (cap) {
          cap.setAttribute("data-caption",
            s.heading + (s.desc ? " \u2014 " + s.desc : ""));
        }
      });
      var html = "<!DOCTYPE html>\n" + state[0].fig.ownerDocument.documentElement.outerHTML;
      var blob = new Blob([html], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gallery.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      say("Downloaded. Replace gallery.html in the repo with this file and commit.", "ok");
    });
  })();
  </script>
</body>
</html>
